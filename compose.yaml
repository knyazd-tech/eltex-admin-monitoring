services:
  eltex-exporter:
    build:
      context: .
    image: eltex-admin-monitoring:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ELTEX_LISTEN_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:9824:9824"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
